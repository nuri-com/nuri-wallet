name: EAS Update (OTA)

on:
  # Preview channel auto-publishes on every push to a release branch.
  # `dev` is intentionally NOT a trigger: per RELEASE_POLICY.md, dev is
  # integration-only and never publishes an OTA. Bleeding-edge code reaches
  # real devices via the local dev-client, not the shared preview channel.
  push:
    branches:
      - "release/v*"
  # Production channel requires a manual trigger from the Actions tab
  # (select branch = main). Free human-approval gate on plans without
  # GitHub Environment "required reviewers" support.
  workflow_dispatch:
    inputs:
      message:
        description: "OTA release message (defaults to latest commit subject)"
        required: false
        default: ""

concurrency:
  group: ota-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate the publish job behind lint + typecheck. Without this gate, pushing a
  # broken commit to `release/v*` would auto-publish a broken JS bundle to the
  # preview channel; dispatching production from `main` has no other guard
  # either. `npm run check` is the project's combined lint + typecheck command
  # (see package.json) and matches what runs on PRs into dev/main.
  #
  # Tests are intentionally not part of `npm run check` today — when a test
  # job is added, wire it as another `needs:` here. Until then, lint + tsc are
  # the strongest automated gate we have.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: npm run check

  publish:
    needs: check
    runs-on: ubuntu-latest
    # Use github.ref (refs/heads/main) instead of github.ref_name ("main") so
    # a tag literally named "main" can't satisfy this check and silently route
    # to the production environment.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    permissions:
      contents: read
    steps:
      # Explicit branch allow-list. `workflow_dispatch` exposes every ref that
      # carries this workflow file in the Actions UI — without this guard, an
      # arbitrary feature branch could be dispatched and would publish to the
      # preview channel (since the env mapping above sends every non-main ref
      # to preview). GitHub Environment branch restrictions are a defense in
      # depth, not a primary check: they're configured outside the repo and
      # silently skipped if the env doesn't exist or is misconfigured. Fail
      # fast in the workflow itself.
      #
      # Allowed: `main` (production), `release/v*` (preview). `dev` is NOT
      # allowed — see the comment on the `push` trigger above.
      - name: Guard ref
        env:
          # github.ref includes the refs/heads/ or refs/tags/ prefix so we can
          # match branch refs specifically. github.ref_name strips the prefix
          # and would let a tag named "main" or "release/v*" pass this guard.
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/heads/release/v*) ;;
            *)
              echo "::error::OTA publishes are only allowed from branch 'main' or 'release/v*'. Got: $REF"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Determine channel
        id: channel
        env:
          # See Guard ref step — match the full ref to avoid tag impersonation.
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            echo "channel=production" >> "$GITHUB_OUTPUT"
            echo "variant=production" >> "$GITHUB_OUTPUT"
          else
            echo "channel=preview" >> "$GITHUB_OUTPUT"
            echo "variant=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OTA update
        env:
          # Metro exports iOS + Android with source maps in one Node process.
          # The v0.97.0 RC crossed Node's default ~2 GB heap ceiling near the
          # end of bundling; use the runner's available memory instead.
          NODE_OPTIONS: --max-old-space-size=6144
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VARIANT: ${{ steps.channel.outputs.variant }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          INPUT_MESSAGE: ${{ inputs.message }}
        # eas-cli version is enforced project-wide via eas.json `cli.version`.
        # Pin the version in the npx invocation so CI doesn't download a newer
        # one and trip eas.json's version check.
        #
        # All ${{ }} interpolation lands in env vars only, never in shell command
        # text — otherwise a crafted INPUT_MESSAGE or commit subject could inject
        # shell commands into the publish step where EXPO_TOKEN lives.
        #
        # --environment "$CHANNEL" is required: without it, eas-cli SDK 53
        # falls back to local .env files during bundling. CI has no real .env
        # (only .env.example), so EXPO_PUBLIC_* references would inline as
        # empty/default and ship a misconfigured bundle. The environment name
        # mirrors the channel ("preview"/"production"); the admin setup creates
        # both EAS environments with the matching names.
        run: |
          if [ -n "$INPUT_MESSAGE" ]; then
            MSG="$INPUT_MESSAGE"
          else
            MSG=$(git log -1 --pretty=%s)
          fi
          npx -y eas-cli@18.11.0 \
            update \
            --channel "$CHANNEL" \
            --environment "$CHANNEL" \
            --message "$MSG" \
            --non-interactive
