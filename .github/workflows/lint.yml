name: Lint & Format

on:
  pull_request:
    branches: [dev, main, "release/v*"]

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run biome check
        run: npm run lint
