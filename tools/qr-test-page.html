<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuri Universal QR Scanner - Test Page</title>
<script src="vendor/qrcode-generator.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f0f0;
    color: #1a1a1a;
    padding: 24px;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .instructions {
    background: #fff;
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 32px;
    font-size: 14px;
    line-height: 1.6;
    border-left: 4px solid #2563eb;
  }
  .instructions code {
    background: #e5e7eb;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .section { margin-bottom: 40px; }
  .section h2 {
    font-size: 20px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid #d1d5db;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .card-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-label {
    font-weight: 600;
    font-size: 14px;
  }
  .card-standard {
    font-size: 12px;
    color: #6b7280;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 100px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge-green {
    background: #d1fae5;
    color: #065f46;
  }
  .badge-yellow {
    background: #fef3c7;
    color: #92400e;
  }
  .qr-container {
    padding: 8px;
    background: #fff;
  }
  .qr-container img { display: block; }
  .raw-data {
    width: 100%;
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 11px;
    line-height: 1.5;
    color: #4b5563;
    background: #f9fafb;
    border-radius: 6px;
    padding: 10px;
    word-break: break-all;
    white-space: pre-wrap;
  }
</style>
</head>
<body>

<h1>Nuri Universal QR Scanner - Test Page</h1>
<div class="instructions">
  Serve locally with <code>python3 -m http.server -d tools</code> and open
  <code>localhost:8000/qr-test-page.html</code>.<br>
  Then scan each QR code from a phone running the Nuri app to verify the universal scanner handles it correctly.
</div>

<div id="root"></div>

      { id: 26, label: "INVALID IBAN (bad checksum)", standard: "Plain IBAN", status: "new", data: "DE00000000000000000000" }

function makeQR(data) {
  try {
    var qr = qrcode(0, 'M');
    qr.addData(data);
    qr.make();
    return qr.createImgTag(4, 8);
  } catch (e) {
    // Some long data needs a higher type number
    try {
      var qr2 = qrcode(10, 'M');
      qr2.addData(data);
      qr2.make();
      return qr2.createImgTag(3, 8);
    } catch (e2) {
      try {
        var qr3 = qrcode(20, 'L');
        qr3.addData(data);
        qr3.make();
        return qr3.createImgTag(2, 8);
      } catch (e3) {
        return '<span style="color:red;">QR generation failed: ' + e3.message + '</span>';
      }
    }
  }
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

var root = document.getElementById('root');
var html = '';

for (var s = 0; s < sections.length; s++) {
  var section = sections[s];
  html += '<div class="section">';
  html += '<h2>' + escapeHtml(section.title) + '</h2>';
  html += '<div class="grid">';

  for (var i = 0; i < section.items.length; i++) {
    var item = section.items[i];
    var badgeClass = item.status === 'parsed' ? 'badge-green' : 'badge-yellow';
    var badgeText = item.status === 'parsed' ? 'Already parsed' : 'New';

    html += '<div class="card">';
    html += '<div class="card-header">';
    html += '<div><span class="card-label">#' + item.id + ' ' + escapeHtml(item.label) + '</span><br><span class="card-standard">' + escapeHtml(item.standard) + '</span></div>';
    html += '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
    html += '</div>';
    html += '<div class="qr-container">' + makeQR(item.data) + '</div>';
    html += '<div class="raw-data">' + escapeHtml(item.data) + '</div>';
    html += '</div>';
  }

  html += '</div></div>';
}

root.innerHTML = html;
</script>

</body>
</html>
